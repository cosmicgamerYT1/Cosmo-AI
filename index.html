<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cosmo AI - Your Intelligent Universe Explorer</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: linear-gradient(to bottom right, #0c4a6e, #1e3a8a, #1e40af, #3730a3);
            overflow-x: hidden;
        }

        /* Animated cosmic background */
        .stars-container {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        .stars {
            width: 1px;
            height: 1px;
            background: transparent;
            box-shadow: 779px 1331px #FFF, 324px 42px #FFF, 303px 586px #FFF, 1312px 276px #FFF, 451px 625px #FFF, 
                521px 1931px #FFF, 1087px 1871px #FFF, 36px 1546px #FFF, 132px 934px #FFF, 1698px 901px #FFF,
                1418px 664px #FFF, 1448px 1157px #FFF, 1084px 232px #FFF, 347px 1776px #FFF, 1722px 243px #FFF,
                1629px 835px #FFF, 479px 969px #FFF, 1231px 960px #FFF, 586px 384px #FFF, 164px 527px #FFF;
            animation: twinkle 3s infinite;
        }

        .stars2 {
            width: 2px;
            height: 2px;
            background: transparent;
            box-shadow: 779px 1331px #FFF, 324px 42px #FFF, 303px 586px #FFF, 1312px 276px #FFF, 451px 625px #FFF, 
                521px 1931px #FFF, 1087px 1871px #FFF, 36px 1546px #FFF, 132px 934px #FFF, 1698px 901px #FFF;
            animation: twinkle 5s infinite;
        }

        .stars3 {
            width: 3px;
            height: 3px;
            background: transparent;
            box-shadow: 779px 1331px #FFF, 324px 42px #FFF, 303px 586px #FFF, 1312px 276px #FFF, 451px 625px #FFF;
            animation: twinkle 7s infinite;
        }

        .app-container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Header */
        header {
            background: linear-gradient(to right, rgba(49, 46, 129, 0.3), rgba(88, 28, 135, 0.3));
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(99, 102, 241, 0.2);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .header-content {
            max-width: 80rem;
            margin: 0 auto;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo-section {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo-wrapper {
            position: relative;
        }

        .logo-glow {
            position: absolute;
            inset: 0;
            background: linear-gradient(to right, #22d3ee, #a855f7);
            border-radius: 9999px;
            filter: blur(16px);
            opacity: 0.5;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 0.8; }
        }

        .logo {
            position: relative;
            background: linear-gradient(to bottom right, #22d3ee, #3b82f6, #a855f7);
            padding: 0.75rem;
            border-radius: 9999px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .logo svg {
            width: 2rem;
            height: 2rem;
            color: white;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.25rem;
            font-weight: bold;
            background: linear-gradient(to right, #a5f3fc, #93c5fd, #d8b4fe);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .subtitle {
            color: #a5b4fc;
            font-size: 0.875rem;
            margin-top: 0.25rem;
        }

        .mode-toggle {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.625rem 1.25rem;
            border-radius: 9999px;
            font-weight: 500;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border: none;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .mode-toggle:hover {
            transform: scale(1.05);
        }

        .mode-toggle:active {
            transform: scale(0.95);
        }

        .mode-toggle.chat-mode {
            background: linear-gradient(to right, #06b6d4, #3b82f6);
            color: white;
        }

        .mode-toggle.image-mode {
            background: linear-gradient(to right, #a855f7, #ec4899);
            color: white;
        }

        /* Messages */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 2rem 1.5rem;
        }

        .messages-wrapper {
            max-width: 64rem;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        .message.user {
            justify-content: flex-end;
        }

        .message.assistant {
            justify-content: flex-start;
        }

        .message-content {
            max-width: 80%;
            border-radius: 1rem;
            padding: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
        }

        .message.user .message-content {
            background: linear-gradient(to bottom right, rgba(6, 182, 212, 0.2), rgba(59, 130, 246, 0.2));
            border: 1px solid rgba(34, 211, 238, 0.3);
            color: #ecfeff;
        }

        .message.assistant .message-content {
            background: linear-gradient(to bottom right, rgba(168, 85, 247, 0.2), rgba(99, 102, 241, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.3);
            color: #f3e8ff;
        }

        .message.assistant.error .message-content {
            background: linear-gradient(to bottom right, rgba(127, 29, 29, 0.3), rgba(154, 52, 18, 0.3));
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #fee2e2;
        }

        .message-header {
            font-size: 0.875rem;
            opacity: 0.7;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .message-header svg {
            width: 1rem;
            height: 1rem;
        }

        .message-badge {
            font-size: 0.75rem;
            background: rgba(168, 85, 247, 0.3);
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
        }

        .message-text {
            white-space: pre-wrap;
            line-height: 1.625;
        }

        .message-time {
            font-size: 0.75rem;
            opacity: 0.5;
            margin-top: 0.5rem;
        }

        .loading-indicator {
            display: flex;
            animation: fadeIn 0.4s ease-out;
        }

        .loading-content {
            background: linear-gradient(to bottom right, rgba(168, 85, 247, 0.2), rgba(99, 102, 241, 0.2));
            border: 1px solid rgba(168, 85, 247, 0.3);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 0.75rem;
            color: #ddd6fe;
        }

        .loading-dots {
            display: flex;
            gap: 0.25rem;
        }

        .loading-dot {
            width: 0.5rem;
            height: 0.5rem;
            background: #22d3ee;
            border-radius: 9999px;
            animation: bounce 1s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
            background: #3b82f6;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
            background: #a855f7;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Input Section */
        .input-section {
            background: linear-gradient(to right, rgba(49, 46, 129, 0.3), rgba(88, 28, 135, 0.3));
            backdrop-filter: blur(20px);
            border-top: 1px solid rgba(99, 102, 241, 0.2);
            padding: 1.5rem;
        }

        .input-wrapper {
            max-width: 64rem;
            margin: 0 auto;
        }

        .input-form {
            display: flex;
            gap: 0.75rem;
        }

        .input-field {
            flex: 1;
            background: rgba(15, 23, 42, 0.5);
            color: white;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 1rem;
            padding: 1rem 1.5rem;
            font-size: 1rem;
            font-family: 'Inter', sans-serif;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: all 0.3s;
        }

        .input-field:focus {
            outline: none;
            ring: 2px;
            ring-color: rgba(34, 211, 238, 0.5);
            border-color: rgba(34, 211, 238, 0.5);
        }

        .input-field::placeholder {
            color: rgba(165, 180, 252, 0.5);
        }

        .input-field:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-button {
            background: linear-gradient(to right, #06b6d4, #3b82f6, #a855f7);
            color: white;
            padding: 1rem 2rem;
            border-radius: 1rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
        }

        .submit-button:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .submit-button:active:not(:disabled) {
            transform: scale(0.95);
        }

        .submit-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .submit-button svg {
            width: 1.25rem;
            height: 1.25rem;
        }

        .input-hint {
            text-align: center;
            color: rgba(165, 180, 252, 0.6);
            font-size: 0.875rem;
            margin-top: 0.75rem;
        }

        /* Scrollbar styling */
        .messages-container::-webkit-scrollbar {
            width: 8px;
        }

        .messages-container::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.3);
        }

        .messages-container::-webkit-scrollbar-thumb {
            background: rgba(99, 102, 241, 0.5);
            border-radius: 4px;
        }

        .messages-container::-webkit-scrollbar-thumb:hover {
            background: rgba(99, 102, 241, 0.7);
        }
    </style>
</head>
<body>
    <div class="stars-container">
        <div class="stars"></div>
        <div class="stars2"></div>
        <div class="stars3"></div>
    </div>

    <div class="app-container">
        <header>
            <div class="header-content">
                <div class="logo-section">
                    <div class="logo-wrapper">
                        <div class="logo-glow"></div>
                        <div class="logo">
                            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
                            </svg>
                        </div>
                    </div>
                    <div>
                        <h1>Cosmo AI</h1>
                        <p class="subtitle">Your Intelligent Universe Explorer</p>
                    </div>
                </div>
                <button class="mode-toggle chat-mode" id="modeToggle">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    <span id="modeText">Chat Mode</span>
                </button>
            </div>
        </header>

        <div class="messages-container" id="messagesContainer">
            <div class="messages-wrapper" id="messagesWrapper"></div>
        </div>

        <div class="input-section">
            <div class="input-wrapper">
                <form class="input-form" id="inputForm">
                    <input 
                        type="text" 
                        class="input-field" 
                        id="inputField" 
                        placeholder="💫 Ask Cosmo anything..."
                        autocomplete="off"
                    >
                    <button type="submit" class="submit-button" id="submitButton">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="m22 2-7 20-4-9-9-4Z"/>
                            <path d="M22 2 11 13"/>
                        </svg>
                        Send
                    </button>
                </form>
                <p class="input-hint" id="inputHint">💫 Powered by advanced AI - ask me anything!</p>
            </div>
        </div>
    </div>

    <script>
        let messages = [];
        let isLoading = false;
        let currentMode = 'chat'; // 'chat' or 'image'

        const messagesContainer = document.getElementById('messagesContainer');
        const messagesWrapper = document.getElementById('messagesWrapper');
        const inputForm = document.getElementById('inputForm');
        const inputField = document.getElementById('inputField');
        const submitButton = document.getElementById('submitButton');
        const modeToggle = document.getElementById('modeToggle');
        const modeText = document.getElementById('modeText');
        const inputHint = document.getElementById('inputHint');

        // Initialize with welcome message
        addMessage({
            role: 'assistant',
            content: '✨ Welcome to Cosmo AI!\n\nI\'m your super-intelligent assistant with advanced capabilities:\n\n🔢 Math Expert - All operations: addition, subtraction, multiplication, division, powers, and more!\n📚 Knowledge Base - Science, history, geography, technology, and more\n🎨 AI Image Generator - Create actual visual images (switch to Image Mode!)\n\nTry asking:\n• "What is 2+2" or "156 take away 45"\n• "What is the speed of light?"\n• "Capital of France?"\n• Or switch to Image Mode and say "space galaxy"!\n\nWhat would you like to explore today?',
            timestamp: new Date()
        });

        // Mode toggle
        modeToggle.addEventListener('click', () => {
            currentMode = currentMode === 'chat' ? 'image' : 'chat';
            updateModeUI();
        });

        function updateModeUI() {
            if (currentMode === 'image') {
                modeToggle.className = 'mode-toggle image-mode';
                modeToggle.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect width="18" height="18" x="3" y="3" rx="2" ry="2"/>
                        <circle cx="9" cy="9" r="2"/>
                        <path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>
                    </svg>
                    <span id="modeText">Image Mode</span>
                `;
                inputField.placeholder = '🎨 Describe an image to generate...';
                inputHint.textContent = '✨ Image generation mode active - describe what you want to see';
            } else {
                modeToggle.className = 'mode-toggle chat-mode';
                modeToggle.innerHTML = `
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>
                    </svg>
                    <span id="modeText">Chat Mode</span>
                `;
                inputField.placeholder = '💫 Ask Cosmo anything...';
                inputHint.textContent = '💫 Powered by advanced AI - ask me anything!';
            }
            inputField.focus();
        }

        // Form submission
        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!inputField.value.trim() || isLoading) return;

            const userMessage = {
                role: 'user',
                content: inputField.value,
                timestamp: new Date(),
                mode: currentMode
            };

            addMessage(userMessage);
            inputField.value = '';
            setLoading(true);

            try {
                if (currentMode === 'image') {
                    await handleImageGeneration(userMessage.content);
                } else {
                    await handleChatMessage(userMessage.content);
                }
            } catch (error) {
                addMessage({
                    role: 'assistant',
                    content: '🔧 Oops! Something unexpected happened. Error: ' + error.message + '. Please try again!',
                    timestamp: new Date(),
                    isError: true
                });
            } finally {
                setLoading(false);
            }
        });

        function addMessage(message) {
            messages.push(message);
            renderMessages();
            scrollToBottom();
            // Scroll again after a short delay to ensure images/content have fully rendered
            setTimeout(scrollToBottom, 100);
            setTimeout(scrollToBottom, 300);
        }

        function renderMessages() {
            messagesWrapper.innerHTML = messages.map((msg, index) => {
                const messageClass = msg.role === 'user' ? 'user' : 'assistant' + (msg.isError ? ' error' : '');
                const badgeHTML = msg.mode === 'image' ? '<span class="message-badge">🎨 Image</span>' : '';
                const headerIcon = msg.role === 'assistant' ? `
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9.813 15.904 9 18.75l-.813-2.846a4.5 4.5 0 0 0-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 0 0 3.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 0 0 3.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 0 0-3.09 3.09ZM18.259 8.715 18 9.75l-.259-1.035a3.375 3.375 0 0 0-2.455-2.456L14.25 6l1.036-.259a3.375 3.375 0 0 0 2.455-2.456L18 2.25l.259 1.035a3.375 3.375 0 0 0 2.456 2.456L21.75 6l-1.035.259a3.375 3.375 0 0 0-2.456 2.456ZM16.894 20.567 16.5 21.75l-.394-1.183a2.25 2.25 0 0 0-1.423-1.423L13.5 18.75l1.183-.394a2.25 2.25 0 0 0 1.423-1.423l.394-1.183.394 1.183a2.25 2.25 0 0 0 1.423 1.423l1.183.394-1.183.394a2.25 2.25 0 0 0-1.423 1.423Z" />
                    </svg>
                ` : '';

                // Add image if present with download button
                const imageHTML = msg.imageUrl ? `
                    <div style="margin-top: 15px;">
                        <img src="${msg.imageUrl}" style="max-width: 100%; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);" alt="Generated AI Image" id="generated-image-${index}" />
                        <div style="margin-top: 10px;">
                            <button onclick="downloadImage('${msg.imageUrl}', 'cosmo-ai-image-${index}.png')" style="
                                background: linear-gradient(to right, #06b6d4, #3b82f6, #a855f7);
                                color: white;
                                border: none;
                                padding: 10px 20px;
                                border-radius: 8px;
                                cursor: pointer;
                                font-weight: 600;
                                font-size: 14px;
                                display: flex;
                                align-items: center;
                                gap: 8px;
                                transition: all 0.3s;
                                box-shadow: 0 4px 6px rgba(0,0,0,0.3);
                            " onmouseover="this.style.transform='scale(1.05)'" onmouseout="this.style.transform='scale(1)'">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                    <polyline points="7 10 12 15 17 10"/>
                                    <line x1="12" y1="15" x2="12" y2="3"/>
                                </svg>
                                Download Image
                            </button>
                        </div>
                    </div>
                ` : '';

                return `
                    <div class="message ${messageClass}" style="animation-delay: ${index * 0.05}s">
                        <div class="message-content">
                            <div class="message-header">
                                <strong>${msg.role === 'user' ? 'You' : `${headerIcon} Cosmo AI`}</strong>
                                ${badgeHTML}
                            </div>
                            <div class="message-text">${msg.content}</div>
                            ${imageHTML}
                            <div class="message-time">${msg.timestamp.toLocaleTimeString()}</div>
                        </div>
                    </div>
                `;
            }).join('');

            if (isLoading) {
                messagesWrapper.innerHTML += `
                    <div class="loading-indicator">
                        <div class="loading-content">
                            <div class="loading-dots">
                                <div class="loading-dot"></div>
                                <div class="loading-dot"></div>
                                <div class="loading-dot"></div>
                            </div>
                            <span style="font-size: 0.875rem; font-weight: 500;">${currentMode === 'image' ? 'Generating image...' : 'Cosmo is thinking...'}</span>
                        </div>
                    </div>
                `;
            }
            
            // Scroll after rendering
            setTimeout(scrollToBottom, 50);
        }

        function setLoading(loading) {
            isLoading = loading;
            inputField.disabled = loading;
            submitButton.disabled = loading;
            renderMessages();
        }

        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // ── Cosmo AI Chat Brain ─────────────────────────────────────────────

        function getTopicEmoji(text) {
            const t = text.toLowerCase();
            if (/dinosaur|fossil|extinct|paleontology/.test(t)) return '🦕';
            if (/planet|space|star|galaxy|cosmos|astrono/.test(t)) return '🌌';
            if (/war|history|ancient|empire|civiliz/.test(t)) return '📜';
            if (/physics|chemistry|atom|quantum|biology|science/.test(t)) return '🔬';
            if (/math|equation|formula|calculus/.test(t)) return '🔢';
            if (/country|city|capital|geography|continent/.test(t)) return '🌍';
            if (/music|art|paint|culture|film|movie/.test(t)) return '🎨';

                for (let round = 0; round < 5; round++) {
                    const resp = await fetch("https://api.anthropic.com/v1/messages", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            model: "claude-sonnet-4-20250514",
                            max_tokens: 1000,
                            system: "You are Cosmo AI, a brilliant helpful assistant. Answer clearly, accurately, and with relevant emojis. Be conversational and genuinely helpful.",
                            tools: [{ type: "web_search_20250305", name: "web_search" }],
                            messages: msgs
                        })
                    });
                    data = await resp.json();
                    if (data.error || !data.content) return null;
                    const hasToolUse = data.content.some(b => b.type === 'tool_use');
                    if (!hasToolUse || data.stop_reason === 'end_turn') break;
                    msgs = [...msgs,
                        { role: 'assistant', content: data.content },

                    ];

        async function tryMath(message) {
            let expr = message
                .replace(/[?!.]/g, '')
                .replace(/\b(what\s+is|what'?s|calculate|compute|work\s+out|solve|equals?)\b/gi, '')
                .replace(/\btake\s+away\b/g, '-')
                .replace(/\bsubtract(ed)?\b/g, '-')
                .replace(/\bminus\b/g, '-')
                .replace(/\bplus\b|\badd(ed)?\b/g, '+')
                .replace(/\btimes\b|\bmultiplied?\s+by\b/g, '*')
                .replace(/\bdivided?\s+by\b|\bover\b/g, '/')
                .replace(/\bsquared\b/g, '**2')
                .replace(/\bcubed\b/g, '**3')
                .replace(/\bto\s+the\s+power\s+of\s+(\d+)/g, '**$1')
                .replace(/×/g, '*').replace(/÷/g, '/')
                .trim();

            // Must be purely numeric/operator after substitution
            if (/^[-\d\s+\-*\/().%^*]+$/.test(expr) && /\d/.test(expr) && /[+\-*\/]/.test(expr)) {
                try {
                    const result = Function('"use strict"; return (' + expr + ')')();
                    if (typeof result === 'number' && isFinite(result)) {
                        const r = Math.round(result * 1e9) / 1e9;
                        return `🔢 The answer is ${r}`;
                    }
                } catch(e) {}
            }
            return null;
        }

        async function tryWikipedia(message) {
            // Don't search Wikipedia for math-like inputs
            const lm = message.toLowerCase();
            if (/\b(take away|plus|minus|times|divided by|multiply|subtract)\b/.test(lm) && /\d/.test(lm)) return null;
            if (/^[\d\s+\-*\/.()%^x×÷]+$/.test(lm)) return null;

            // Strip question words to get the core subject
            const query = message
                .replace(/^(please\s+)?(tell me|explain|describe|what is|what are|what was|who is|who was|who are|where is|when did|when was|how does|how do|why are|why is|why did|are|is|was|were|did|does|do|has|have)\s+/i, '')
                .replace(/\?+$/, '')
                .trim();

            if (query.length < 3) return null;

            // Search Wikipedia
            const searchResp = await fetch(
                `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(query)}&format=json&origin=*&srlimit=1`
            );
            if (!searchResp.ok) return null;
            const searchData = await searchResp.json();
            if (!searchData.query?.search?.length) return null;

            const title = searchData.query.search[0].title;

            // Get a clean intro extract
            const extractResp = await fetch(
                `https://en.wikipedia.org/w/api.php?action=query&prop=extracts&exintro=true&explaintext=true&exsentences=5&titles=${encodeURIComponent(title)}&format=json&origin=*`
            );
            if (!extractResp.ok) return null;
            const extractData = await extractResp.json();
            const pages = extractData.query?.pages;
            if (!pages) return null;

            const page = Object.values(pages)[0];
            const raw = page?.extract?.trim();
            if (!raw || raw.length < 40 || raw.startsWith('may refer to')) return null;

            // Take first 3–4 sentences, cap at 500 chars
            const sentences = raw.replace(/\n+/g, ' ').match(/[^.!?]+[.!?]+/g) || [raw];
            let summary = '';
            for (const s of sentences) {
                if ((summary + s).length > 500) break;
                summary += s + ' ';
            }
            summary = summary.trim();

            const emoji = getTopicEmoji(title + ' ' + query);
            return `${emoji} ${title}\n\n${summary}`;
        }

        function generateSmartResponse(input) {

        function evaluateMath(expression) {
            // Clean the expression
            expression = expression
                .replace(/\s/g, '')
                .replace(/×/g, '*')
                .replace(/÷/g, '/')
                .replace(/\^/g, '**')
                .replace(/,/g, '');
            
            // Validate it only contains safe characters
            if (!/^[\d+\-*/.()%*]+$/.test(expression)) {
                throw new Error('Invalid expression');
            }
            
            // Check for division by zero before evaluation
            if (expression.match(/\/\s*0(?!\d)/) || expression.match(/\/0$/)) {
                return 'Cannot divide by zero!';
            }
            
            // Check for empty parentheses
            if (expression.includes('()')) {
                throw new Error('Invalid expression: empty parentheses');
            }
            
            // Check for double operators (except ** for power)
            if (expression.match(/[+\-*/%]{3,}/) || expression.match(/[+\-/%]{2,}/)) {
                throw new Error('Invalid expression: double operators');
            }
            
            try {
                // Use Function constructor for safe evaluation
                const result = Function('"use strict"; return (' + expression + ')')();
                
                // Handle special cases
                if (!isFinite(result)) {
                    return 'Result is infinite or undefined';
                }
                
                if (isNaN(result)) {
                    return 'Invalid calculation';
                }
                
                // Round to reasonable precision (handle very small numbers)
                if (Math.abs(result) < 0.000000001 && result !== 0) {
                    return result.toExponential(6);
                }
                
                return Math.round(result * 1000000000) / 1000000000;
            } catch (e) {
                throw new Error('Cannot evaluate expression');
            }
        }

        function drawSkeleton(ctx, W, H) {
            const bg = ctx.createLinearGradient(0,0,0,H);
            bg.addColorStop(0,'#0a0a1a'); bg.addColorStop(1,'#1a1a3a');
            ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
            for(let i=0;i<60;i++){
                const sx=Math.random()*W, sy=Math.random()*H*0.8;
                ctx.fillStyle=`rgba(255,255,255,${0.3+Math.random()*0.7})`;
                ctx.fillRect(sx,sy,1,1);
            }
            for(let i=0;i<11;i++){
                ctx.fillStyle=(i%2===0)?'#444':'#333';
                ctx.fillRect(i*80-40,H-55,80,55);
                ctx.strokeStyle='#222'; ctx.lineWidth=1.5;
                ctx.strokeRect(i*80-40,H-55,80,55);
            }
            const cx=W/2, floor=H-55, BONE='#d4d0c0', DARK='#aaa89a';
            // Legs (thin)
            ctx.fillStyle=BONE; ctx.fillRect(cx-20,floor-130,14,130);
            ctx.fillRect(cx+6,floor-130,14,130);
            ctx.fillStyle=DARK; ctx.fillRect(cx-7,floor-130,3,130); ctx.fillRect(cx+18,floor-130,3,130);
            // Body (ribcage)
            ctx.fillStyle=BONE; ctx.fillRect(cx-24,floor-250,48,120);
            // Ribs
            ctx.strokeStyle=DARK; ctx.lineWidth=3;
            for(let r=0;r<5;r++){
                ctx.beginPath(); ctx.moveTo(cx-20,floor-240+r*18); ctx.lineTo(cx+20,floor-240+r*18); ctx.stroke();
            }
            // Arms (bow held to right)
            ctx.fillStyle=BONE; ctx.fillRect(cx-42,floor-245,14,100); // left arm
            ctx.fillRect(cx+28,floor-245,14,100); // right arm
            // Bow
            ctx.strokeStyle='#8B4513'; ctx.lineWidth=4;
            ctx.beginPath(); ctx.arc(cx+80,floor-210,60,Math.PI*0.6,Math.PI*1.4); ctx.stroke();
            ctx.strokeStyle='#ccc'; ctx.lineWidth=1.5;
            ctx.beginPath(); ctx.moveTo(cx+80,floor-170); ctx.lineTo(cx+80,floor-250); ctx.stroke();
            // Arrow
            ctx.strokeStyle='#8B4513'; ctx.lineWidth=2;
            ctx.beginPath(); ctx.moveTo(cx+40,floor-210); ctx.lineTo(cx+75,floor-210); ctx.stroke();
            // Head
            ctx.fillStyle=BONE; ctx.fillRect(cx-24,floor-310,48,60);
            // Skull features
            ctx.fillStyle='#222'; ctx.fillRect(cx-14,floor-295,12,12); ctx.fillRect(cx+2,floor-295,12,12);
            ctx.fillRect(cx-8,floor-274,4,8); ctx.fillRect(cx-2,floor-274,4,8); ctx.fillRect(cx+4,floor-274,4,8);
            ctx.fillStyle=BONE; ctx.font='bold 20px monospace'; ctx.textAlign='center';
            ctx.fillText('SKELETON',W/2,30);
        }

        // ── Smart image dispatcher ───────────────────────────────────────────

        // ── Prompt enhancer — turns any request into a high-quality AI prompt ──

        function buildImagePrompt(prompt, lp) {
            const quality = 'masterpiece, best quality, highly detailed, sharp focus, 8k, professional digital artwork, vibrant colors, dramatic lighting';

            let style = '';

            if (lp.includes('minecraft')) {
                const is3d = /3d|three.?d/i.test(prompt);
                style = is3d
                    ? 'minecraft 3D render, voxel art, cinematic volumetric lighting, dramatic shadows, ray tracing, epic composition, professional game art, depth of field'
                    : 'minecraft pixel art style, voxel characters, cinematic lighting, epic dramatic atmosphere, professional Minecraft artwork, glowing effects';
            } else if (/space|galaxy|cosmic|nebula|star|universe/.test(lp)) {
                style = 'deep space digital art, glowing nebula, volumetric light, stars, cosmic scale, cinematic atmosphere, dark background with vibrant purples and blues';
            } else if (/3d|three.?d|three dimensional/i.test(prompt)) {
                style = '3D render, octane render, photorealistic, studio lighting, ray tracing, physically based rendering, subsurface scattering, dramatic shadows, depth of field';
            } else if (/portrait|character|hero|warrior|wizard|knight/.test(lp)) {
                style = 'character concept art, digital painting, cinematic portrait, dramatic rim lighting, epic fantasy composition, detailed face and costume';
            } else if (/landscape|nature|forest|mountain|ocean|sunset|waterfall/.test(lp)) {
                style = 'landscape photography, photorealistic, golden hour, dramatic sky, atmospheric perspective, detailed foreground, cinematic composition';
            } else if (/anime|manga|chibi|kawaii/.test(lp)) {
                style = 'anime illustration, studio quality, detailed, clean linework, vibrant colors, soft shading, professional anime art';
            } else if (/logo|icon|badge|emblem/.test(lp)) {
                style = 'vector art, clean professional design, sharp, bold colors, graphic design, transparent-friendly';
            } else if (/city|building|architecture|urban/.test(lp)) {
                style = 'architectural visualization, cinematic, dramatic lighting, neon reflections, photorealistic, detailed';
            } else if (/dragon|fantasy|magic|mythical/.test(lp)) {
                style = 'epic fantasy art, dramatic lighting, magical atmosphere, detailed creature design, cinematic, concept art';
            } else {
                style = 'digital art, concept art, cinematic composition, dramatic lighting, richly detailed, atmospheric';
            }

            return `${prompt}, ${style}, ${quality}`;
        }

        // ── Image generation — Pollinations.ai (FLUX) + canvas fallback ──────

        async function handleImageGeneration(prompt) {
            const lp = prompt.toLowerCase();

            // Detect modifiers that mean "use real AI, not canvas"
            const is3D        = /\b3d\b|3-d|three[\s-]?d\b/i.test(prompt);
            const isCustomSkin = /galaxy|cosmic|skin|player|character|custom|youtuber|gamer|yt/i.test(lp);

            // ── Canvas path: only for plain named characters, no 3D, no custom skin ──
            if (!is3D && !isCustomSkin) {
                const charMap = {
                    enderman : () => { const cv=make800(); drawEnderman(cv.getContext('2d'),800,600); return cv; },
                    'ender man': () => { const cv=make800(); drawEnderman(cv.getContext('2d'),800,600); return cv; },
                    creeper  : () => { const cv=make800(); drawCreeper(cv.getContext('2d'),800,600); return cv; },
                    zombie   : () => { if(!lp.includes('minecraft')) return null; const cv=make800(); drawZombie(cv.getContext('2d'),800,600); return cv; },
                    skeleton : () => { if(!lp.includes('minecraft')) return null; const cv=make800(); drawSkeleton(cv.getContext('2d'),800,600); return cv; },
                    steve    : () => { const cv=make800(); drawSteve(cv.getContext('2d'),800,600); return cv; },
                };
                for (const [key, fn] of Object.entries(charMap)) {
                    if (lp.includes(key)) {
                        const cv = fn();
                        if (cv) {
                            addMessage({ role:'assistant',
                                content:`🎨 AI Image Generated!\n\nYour Prompt: "${prompt}"\n\nGenerated Image:`,
                                timestamp:new Date(), isImage:true, imageUrl:cv.toDataURL('image/png') });
                            return;
                        }
                    }
                }
            }

            // ── Pollinations path: real AI image for everything else ──────────────
            const enhanced = buildImagePrompt(prompt, lp);
            const seed = Math.floor(Math.random() * 999999);
            const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(enhanced)}?width=1024&height=1024&seed=${seed}&nologo=true&model=flux`;

            // Add the message immediately — the <img> tag loads Pollinations in the background
            // (no blocking preload; image appears once Pollinations finishes generating ~10-30s)
            addMessage({
                role: 'assistant',
                content: `🎨 AI Image Generated!\n\nYour Prompt: "${prompt}"\n\n⏳ Image is loading — Pollinations AI is generating it now (may take 15–30 seconds)...\n\nGenerated Image:`,
                timestamp: new Date(),
                isImage: true,
                imageUrl: url
            });
        }

        function make800() {

            cv.width = 800; cv.height = 600;
            return cv;
        }

        // GAMING CHARACTER DRAWING FUNCTIONS
        
        function generateAnimatronicBear(ctx, canvas, prompt) {
            // Dark stage background
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1a1a2e');
            gradient.addColorStop(1, '#0f0f1e');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stage floor
            ctx.fillStyle = '#2d2d44';
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
            
            // Spotlight effect
            const spotlight = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, 300);
            spotlight.addColorStop(0, 'rgba(255, 255, 200, 0.15)');
            spotlight.addColorStop(1, 'rgba(255, 255, 200, 0)');
            ctx.fillStyle = spotlight;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Bear body (worn brown animatronic)
            ctx.fillStyle = '#6B4423';
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, canvas.height/2 + 80, 140, 120, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Wear and tear on body
            ctx.fillStyle = '#4A2F1A';
            for (let i = 0; i < 10; i++) {
                ctx.fillRect(canvas.width/2 - 100 + Math.random() * 200, canvas.height/2 + 20 + Math.random() * 120, 10 + Math.random() * 15, 3);
            }
            
            // Bear head
            ctx.fillStyle = '#6B4423';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2 - 30, 100, 0, Math.PI * 2);
            ctx.fill();
            
            // Mechanical joints visible
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2 - 30, 100, 0, Math.PI * 2);
            ctx.stroke();
            
            // Bear ears (round)
            ctx.fillStyle = '#6B4423';
            ctx.beginPath();
            ctx.arc(canvas.width/2 - 80, canvas.height/2 - 100, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            ctx.fillStyle = '#6B4423';
            ctx.beginPath();
            ctx.arc(canvas.width/2 + 80, canvas.height/2 - 100, 35, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();
            
            // Inner ears
            ctx.fillStyle = '#4A2F1A';
            ctx.beginPath();
            ctx.arc(canvas.width/2 - 80, canvas.height/2 - 100, 20, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width/2 + 80, canvas.height/2 - 100, 20, 0, Math.PI * 2);
            ctx.fill();
            
            // Snout
            ctx.fillStyle = '#8B6340';
            ctx.beginPath();
            ctx.ellipse(canvas.width/2, canvas.height/2 + 10, 55, 40, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Black nose
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2 + 5, 18, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes (creepy glowing)
            ctx.fillStyle = '#1a1a1a';
            ctx.beginPath();
            ctx.arc(canvas.width/2 - 35, canvas.height/2 - 35, 22, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width/2 + 35, canvas.height/2 - 35, 22, 0, Math.PI * 2);
            ctx.fill();
            
            // Glowing pupils (creepy!)
            ctx.fillStyle = '#00ff88';
            ctx.shadowBlur = 20;
            ctx.shadowColor = '#00ff88';
            ctx.beginPath();
            ctx.arc(canvas.width/2 - 35, canvas.height/2 - 35, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width/2 + 35, canvas.height/2 - 35, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            
            // Teeth (showing mechanical endoskeleton)
            ctx.fillStyle = '#fff';
            for (let i = 0; i < 6; i++) {
                ctx.fillRect(canvas.width/2 - 30 + i * 10, canvas.height/2 + 35, 8, 15);
            }
            
            // Arms (mechanical looking)
            ctx.fillStyle = '#6B4423';
            ctx.fillRect(canvas.width/2 - 170, canvas.height/2 + 40, 40, 100);
            ctx.fillRect(canvas.width/2 + 130, canvas.height/2 + 40, 40, 100);
            
            // Exposed wires
            ctx.strokeStyle = '#ff0000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 150, canvas.height/2 + 50);
            ctx.lineTo(canvas.width/2 - 155, canvas.height/2 + 70);
            ctx.stroke();
            
            // Bow tie
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 25, canvas.height/2 + 60);
            ctx.lineTo(canvas.width/2 - 45, canvas.height/2 + 50);
            ctx.lineTo(canvas.width/2 - 45, canvas.height/2 + 70);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 + 25, canvas.height/2 + 60);
            ctx.lineTo(canvas.width/2 + 45, canvas.height/2 + 50);
            ctx.lineTo(canvas.width/2 + 45, canvas.height/2 + 70);
            ctx.closePath();
            ctx.fill();
            ctx.fillRect(canvas.width/2 - 8, canvas.height/2 + 52, 16, 16);
            
            // Top hat
            ctx.fillStyle = '#000';
            ctx.fillRect(canvas.width/2 - 50, canvas.height/2 - 145, 100, 15);
            ctx.fillRect(canvas.width/2 - 35, canvas.height/2 - 175, 70, 30);
        }
        
        function generateMinecraftCreeper(ctx, canvas, prompt) {
            // Minecraft sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#90C0FF');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grass blocks
            ctx.fillStyle = '#7BC043';
            for (let i = 0; i < 10; i++) {
                ctx.fillRect(i * 80, canvas.height - 80, 80, 80);
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeRect(i * 80, canvas.height - 80, 80, 80);
            }
            
            // Creeper body (iconic green)
            ctx.fillStyle = '#0DA70D';

        function generateSonicStyle(ctx, canvas, prompt) {
            // Sky with hills
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#00BFFF');
            gradient.addColorStop(1, '#87CEEB');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Green hill
            ctx.fillStyle = '#228B22';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.7);
            ctx.quadraticCurveTo(canvas.width/4, canvas.height * 0.6, canvas.width/2, canvas.height * 0.65);
            ctx.quadraticCurveTo(canvas.width * 0.75, canvas.height * 0.7, canvas.width, canvas.height * 0.75);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.closePath();
            ctx.fill();
            
            // Sonic body (blue)
            const sX = canvas.width/2;
            const sY = canvas.height/2;
            
            // Body
            ctx.fillStyle = '#0066FF';
            ctx.beginPath();
            ctx.ellipse(sX, sY + 20, 70, 85, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Head
            ctx.beginPath();
            ctx.arc(sX, sY - 50, 80, 0, Math.PI * 2);
            ctx.fill();
            
            // Spiky quills (Sonic's iconic spikes)
            ctx.fillStyle = '#0066FF';
            for (let i = 0; i < 5; i++) {
                ctx.beginPath();
                const angle = Math.PI - (i * Math.PI / 6) - Math.PI/3;
                const x = sX + Math.cos(angle) * 80;
                const y = sY - 50 + Math.sin(angle) * 80;
                const spikeX = sX + Math.cos(angle) * 150;
                const spikeY = sY - 50 + Math.sin(angle) * 150;
                ctx.moveTo(x, y);
                ctx.lineTo(spikeX, spikeY);
                ctx.lineTo(x + Math.cos(angle + 0.3) * 40, y + Math.sin(angle + 0.3) * 40);
                ctx.closePath();
                ctx.fill();
            }
            
            // Face (beige/tan)
            ctx.fillStyle = '#FFDEAD';
            ctx.beginPath();
            ctx.ellipse(sX, sY - 35, 55, 60, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Eyes (large and connected)
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.ellipse(sX - 15, sY - 60, 25, 30, -0.2, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(sX + 15, sY - 60, 25, 30, 0.2, 0, Math.PI * 2);
            ctx.fill();
            
            // Pupils (green)
            ctx.fillStyle = '#00AA00';
            ctx.beginPath();
            ctx.ellipse(sX - 15, sY - 55, 12, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(sX + 15, sY - 55, 12, 18, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Black pupils
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(sX - 15, sY - 52, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(sX + 15, sY - 52, 8, 0, Math.PI * 2);
            ctx.fill();
            
            // Nose
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.ellipse(sX, sY - 35, 8, 12, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // Smile
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.arc(sX, sY - 25, 25, 0.2, Math.PI - 0.2);
            ctx.stroke();
            
            // Red shoes
            ctx.fillStyle = '#FF0000';
            ctx.beginPath();
            ctx.ellipse(sX - 40, sY + 95, 35, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.ellipse(sX + 40, sY + 95, 35, 25, 0, 0, Math.PI * 2);
            ctx.fill();
            
            // White shoe stripe
            ctx.fillStyle = '#fff';
            ctx.fillRect(sX - 55, sY + 90, 30, 8);
            ctx.fillRect(sX + 25, sY + 90, 30, 8);
            
            // Gold ring (Sonic's ring)
            ctx.strokeStyle = '#FFD700';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.arc(canvas.width - 150, 150, 30, 0, Math.PI * 2);
            ctx.stroke();
            ctx.fillStyle = '#FFD700';
            ctx.font = 'bold 20px Arial';
            ctx.fillText('★', canvas.width - 162, 158);
        }

            ctx.arc(canvas.width/2 - 125, canvas.height/2 + 120, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(canvas.width/2 + 125, canvas.height/2 + 120, 25, 0, Math.PI * 2);
            ctx.fill();
            
            // Legs
            ctx.fillStyle = '#78909C';
            ctx.fillRect(canvas.width/2 - 80, canvas.height/2 + 150, 50, 80);
            ctx.fillRect(canvas.width/2 + 30, canvas.height/2 + 150, 50, 80);
            
            // Feet
            ctx.fillStyle = '#37474F';
            ctx.fillRect(canvas.width/2 - 90, canvas.height/2 + 230, 70, 20);
            ctx.fillRect(canvas.width/2 + 20, canvas.height/2 + 230, 70, 20);
        }
        
        function generateRocket(ctx, canvas, prompt) {
            // Space background
            ctx.fillStyle = '#000033';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Stars
            ctx.fillStyle = '#FFF';
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                ctx.beginPath();
                ctx.arc(x, y, Math.random() * 2, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Rocket body
            ctx.fillStyle = '#E0E0E0';
            ctx.fillRect(canvas.width/2 - 50, canvas.height/2 - 50, 100, 200);
            
            // Rocket nose cone
            ctx.fillStyle = '#FF5722';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 50, canvas.height/2 - 50);
            ctx.lineTo(canvas.width/2, canvas.height/2 - 150);
            ctx.lineTo(canvas.width/2 + 50, canvas.height/2 - 50);
            ctx.closePath();
            ctx.fill();
            
            // Window
            ctx.fillStyle = '#4FC3F7';
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height/2, 30, 0, Math.PI * 2);
            ctx.fill();
            
            // Rocket fins
            ctx.fillStyle = '#D32F2F';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 50, canvas.height/2 + 150);
            ctx.lineTo(canvas.width/2 - 100, canvas.height/2 + 200);
            ctx.lineTo(canvas.width/2 - 50, canvas.height/2 + 200);
            ctx.closePath();
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 + 50, canvas.height/2 + 150);
            ctx.lineTo(canvas.width/2 + 100, canvas.height/2 + 200);
            ctx.lineTo(canvas.width/2 + 50, canvas.height/2 + 200);
            ctx.closePath();
            ctx.fill();
            
            // Rocket flames
            ctx.fillStyle = '#FF9800';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 40, canvas.height/2 + 150);
            ctx.lineTo(canvas.width/2 - 30, canvas.height/2 + 220);
            ctx.lineTo(canvas.width/2 - 20, canvas.height/2 + 150);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#FFEB3B';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 - 10, canvas.height/2 + 150);
            ctx.lineTo(canvas.width/2, canvas.height/2 + 250);
            ctx.lineTo(canvas.width/2 + 10, canvas.height/2 + 150);
            ctx.closePath();
            ctx.fill();
            ctx.fillStyle = '#FF9800';
            ctx.beginPath();
            ctx.moveTo(canvas.width/2 + 20, canvas.height/2 + 150);
            ctx.lineTo(canvas.width/2 + 30, canvas.height/2 + 220);
            ctx.lineTo(canvas.width/2 + 40, canvas.height/2 + 150);
            ctx.closePath();
            ctx.fill();
        }
        
        function generateBalloon(ctx, canvas, prompt) {
            // Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#B0E0E6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Clouds
            drawCloud(ctx, 150, 100, 60);
            drawCloud(ctx, 600, 150, 50);
            
            // Multiple balloons
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8'];
            for (let i = 0; i < 5; i++) {
                const x = 200 + i * 100;
                const y = 200 + Math.sin(i) * 50;
                
                // Balloon
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.ellipse(x, y, 50, 70, 0, 0, Math.PI * 2);
                ctx.fill();
                
                // Balloon knot
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(x, y + 70);
                ctx.lineTo(x - 5, y + 80);
                ctx.lineTo(x + 5, y + 80);
                ctx.closePath();
                ctx.fill();
                
                // String
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(x, y + 80);
                ctx.lineTo(x + Math.sin(i * 2) * 20, y + 200);
                ctx.stroke();
                
                // Highlight
                ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
                ctx.beginPath();
                ctx.ellipse(x - 15, y - 20, 15, 20, -0.3, 0, Math.PI * 2);
                ctx.fill();
            }
        }
        
        function generateCloudScene(ctx, canvas, prompt) {
            // Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#B0E0E6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Multiple clouds
            drawCloud(ctx, 150, 150, 80);
            drawCloud(ctx, 400, 100, 100);
            drawCloud(ctx, 600, 200, 70);
            drawCloud(ctx, 250, 350, 90);
            drawCloud(ctx, 550, 400, 85);
        }
        
        // SCENE DRAWING FUNCTIONS
        
        function generateSpaceScene(ctx, canvas, prompt) {
            // Deep space background gradient
            const gradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, canvas.width);
            gradient.addColorStop(0, '#1a0033');
            gradient.addColorStop(0.5, '#0d001a');
            gradient.addColorStop(1, '#000000');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Add stars
            for (let i = 0; i < 300; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 2;
                const brightness = Math.random();
                ctx.fillStyle = `rgba(255, 255, 255, ${brightness})`;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
            
            // Add colorful nebula
            for (let i = 0; i < 5; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = 100 + Math.random() * 200;
                const nebula = ctx.createRadialGradient(x, y, 0, x, y, radius);
                const colors = ['rgba(138,43,226,0.3)', 'rgba(75,0,130,0.3)', 'rgba(255,20,147,0.3)', 'rgba(0,191,255,0.3)'];
                nebula.addColorStop(0, colors[Math.floor(Math.random() * colors.length)]);
                nebula.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = nebula;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
            
            // Add planets
            for (let i = 0; i < 3; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const radius = 30 + Math.random() * 50;
                const planetGradient = ctx.createRadialGradient(x - radius/3, y - radius/3, 0, x, y, radius);
                planetGradient.addColorStop(0, '#8866ff');
                planetGradient.addColorStop(1, '#4433aa');
                ctx.fillStyle = planetGradient;
                ctx.beginPath();
                ctx.arc(x, y, radius, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function generateSunsetScene(ctx, canvas, prompt) {
            // Sky gradient
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#FF6B6B');
            gradient.addColorStop(0.3, '#FF8E53');
            gradient.addColorStop(0.6, '#FFC371');
            gradient.addColorStop(1, '#FFE5B4');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Sun
            const sunGradient = ctx.createRadialGradient(canvas.width/2, canvas.height * 0.4, 0, canvas.width/2, canvas.height * 0.4, 120);
            sunGradient.addColorStop(0, '#FFF9E6');
            sunGradient.addColorStop(0.5, '#FFD700');
            sunGradient.addColorStop(1, 'rgba(255, 165, 0, 0)');
            ctx.fillStyle = sunGradient;
            ctx.beginPath();
            ctx.arc(canvas.width/2, canvas.height * 0.4, 120, 0, Math.PI * 2);
            ctx.fill();
            
            // Clouds
            ctx.fillStyle = 'rgba(255, 200, 150, 0.5)';
            for (let i = 0; i < 6; i++) {
                const y = 50 + i * 80;
                drawCloud(ctx, 100 + i * 150, y, 100);
            }
        }

        function generateOceanScene(ctx, canvas, prompt) {
            // Sky
            const skyGradient = ctx.createLinearGradient(0, 0, 0, canvas.height/2);
            skyGradient.addColorStop(0, '#87CEEB');
            skyGradient.addColorStop(1, '#B0E0E6');
            ctx.fillStyle = skyGradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height/2);
            
            // Ocean
            const oceanGradient = ctx.createLinearGradient(0, canvas.height/2, 0, canvas.height);
            oceanGradient.addColorStop(0, '#006994');
            oceanGradient.addColorStop(0.5, '#004d6d');
            oceanGradient.addColorStop(1, '#003147');
            ctx.fillStyle = oceanGradient;
            ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);
            
            // Waves
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
            ctx.lineWidth = 3;
            for (let i = 0; i < 10; i++) {
                ctx.beginPath();
                const y = canvas.height/2 + i * 40;
                for (let x = 0; x < canvas.width; x += 40) {
                    const yOffset = Math.sin((x + i * 50) * 0.02) * 15;
                    if (x === 0) {
                        ctx.moveTo(x, y + yOffset);
                    } else {
                        ctx.lineTo(x, y + yOffset);
                    }
                }
                ctx.stroke();
            }
            
            // Sun reflection
            const reflectionGradient = ctx.createRadialGradient(canvas.width/2, canvas.height/2, 0, canvas.width/2, canvas.height/2, 200);
            reflectionGradient.addColorStop(0, 'rgba(255, 255, 200, 0.4)');
            reflectionGradient.addColorStop(1, 'rgba(255, 255, 200, 0)');
            ctx.fillStyle = reflectionGradient;
            ctx.fillRect(0, canvas.height/2, canvas.width, canvas.height/2);
        }

        function generateMountainScene(ctx, canvas, prompt) {
            // Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#1e3a8a');
            gradient.addColorStop(0.5, '#3b82f6');
            gradient.addColorStop(1, '#93c5fd');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Mountains (back to front)
            const mountainLayers = [
                { color: '#4a5568', y: canvas.height * 0.4 },
                { color: '#2d3748', y: canvas.height * 0.5 },
                { color: '#1a202c', y: canvas.height * 0.6 }
            ];
            
            mountainLayers.forEach(layer => {
                ctx.fillStyle = layer.color;
                ctx.beginPath();
                ctx.moveTo(0, canvas.height);
                for (let x = 0; x < canvas.width; x += 50) {
                    const peak = layer.y - Math.random() * 150;
                    ctx.lineTo(x, peak);
                }
                ctx.lineTo(canvas.width, canvas.height);
                ctx.closePath();
                ctx.fill();
            });
        }

        function generateForestScene(ctx, canvas, prompt) {
            // Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height/3);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#B0E0E6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height/3);
            
            // Ground
            ctx.fillStyle = '#2d5016';
            ctx.fillRect(0, canvas.height * 0.7, canvas.width, canvas.height * 0.3);
            
            // Trees
            for (let i = 0; i < 15; i++) {
                const x = (i * 60) + Math.random() * 40;
                const treeHeight = 150 + Math.random() * 100;
                
                // Trunk
                ctx.fillStyle = '#4a3728';
                ctx.fillRect(x, canvas.height * 0.7 - treeHeight, 20, treeHeight);
                
                // Foliage
                ctx.fillStyle = ['#228B22', '#2d5016', '#3d6b1f'][Math.floor(Math.random() * 3)];
                ctx.beginPath();
                ctx.arc(x + 10, canvas.height * 0.7 - treeHeight, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x - 10, canvas.height * 0.7 - treeHeight + 20, 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(x + 25, canvas.height * 0.7 - treeHeight + 25, 30, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function generateCityScene(ctx, canvas, prompt) {
            // Night sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#0a0a1a');
            gradient.addColorStop(1, '#1a1a3a');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Buildings
            for (let i = 0; i < 12; i++) {
                const x = i * 70 + Math.random() * 20;
                const buildingHeight = 200 + Math.random() * 300;
                const width = 50 + Math.random() * 30;
                
                // Building
                ctx.fillStyle = ['#2d3748', '#1a202c', '#374151'][Math.floor(Math.random() * 3)];
                ctx.fillRect(x, canvas.height - buildingHeight, width, buildingHeight);
                
                // Windows
                ctx.fillStyle = Math.random() > 0.3 ? '#FFC837' : '#333';
                for (let w = 0; w < 4; w++) {
                    for (let h = 0; h < buildingHeight / 30; h++) {
                        ctx.fillRect(x + 5 + w * 10, canvas.height - buildingHeight + 10 + h * 30, 6, 15);
                    }
                }
            }
        }

        function generateFireScene(ctx, canvas, prompt) {
            // Dark background
            ctx.fillStyle = '#1a0000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Fire particles
            for (let i = 0; i < 200; i++) {
                const x = canvas.width/2 + (Math.random() - 0.5) * 400;
                const y = canvas.height - Math.random() * canvas.height * 0.8;
                const size = Math.random() * 30 + 5;
                
                const fireGradient = ctx.createRadialGradient(x, y, 0, x, y, size);
                fireGradient.addColorStop(0, '#fff');
                fireGradient.addColorStop(0.3, '#ff0');
                fireGradient.addColorStop(0.6, '#f80');
                fireGradient.addColorStop(1, 'rgba(255,0,0,0)');
                
                ctx.fillStyle = fireGradient;
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function generateRainbowScene(ctx, canvas, prompt) {
            // Sky
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#87CEEB');
            gradient.addColorStop(1, '#B0E0E6');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Rainbow
            const colors = ['#FF0000', '#FF7F00', '#FFFF00', '#00FF00', '#0000FF', '#4B0082', '#9400D3'];
            const centerX = canvas.width / 2;
            const centerY = canvas.height * 0.8;
            const baseRadius = 300;
            
            colors.forEach((color, i) => {
                ctx.strokeStyle = color;
                ctx.lineWidth = 40;
                ctx.beginPath();
                ctx.arc(centerX, centerY, baseRadius - (i * 45), Math.PI, 0);
                ctx.stroke();
            });
            
            // Clouds at rainbow ends
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            drawCloud(ctx, 100, canvas.height * 0.6, 80);
            drawCloud(ctx, canvas.width - 150, canvas.height * 0.6, 80);
        }

        function generateAbstractArt(ctx, canvas, prompt) {
            // Colorful background
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, canvas.height);
            gradient.addColorStop(0, '#667eea');
            gradient.addColorStop(0.5, '#764ba2');
            gradient.addColorStop(1, '#f093fb');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Random shapes
            const colors = ['#FF6B6B', '#4ECDC4', '#45B7D1', '#FFA07A', '#98D8C8', '#F7DC6F', '#BB8FCE'];
            
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * canvas.width;
                const y = Math.random() * canvas.height;
                const size = Math.random() * 100 + 30;
                
                ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)] + '80';
                
                if (Math.random() > 0.5) {
                    // Circle
                    ctx.beginPath();
                    ctx.arc(x, y, size, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Rectangle
                    ctx.fillRect(x, y, size, size);
                }
            }
            
            // Add some lines
            ctx.lineWidth = 5;
            for (let i = 0; i < 15; i++) {
                ctx.strokeStyle = colors[Math.floor(Math.random() * colors.length)] + '60';
                ctx.beginPath();
                ctx.moveTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.lineTo(Math.random() * canvas.width, Math.random() * canvas.height);
                ctx.stroke();
            }
        }

        function drawCloud(ctx, x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size * 0.5, 0, Math.PI * 2);
            ctx.arc(x + size * 0.4, y, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x - size * 0.4, y, size * 0.4, 0, Math.PI * 2);
            ctx.arc(x, y - size * 0.3, size * 0.4, 0, Math.PI * 2);
            ctx.fill();
        }

        // Download image function
        function downloadImage(imageUrl, filename) {
            const link = document.createElement('a');
            link.href = imageUrl;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // Focus input on load
        inputField.focus();
    </script>
</body>
